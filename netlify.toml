[build]
  publish = "."

# Production HTTP security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=15552000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=15552000"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=15552000"

# SPA fallback rule (serves index.html when a requested route is not a static file)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
